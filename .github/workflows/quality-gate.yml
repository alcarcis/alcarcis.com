name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-node
        name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - &setup-pnpm
        name: Set up pnpm from packageManager with a store cache
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install
      # The runner image already has Chromium's system libraries; --with-deps only added
      # fonts the site does not use, fetched from an Ubuntu mirror whose speed varies a lot.
      - name: Install Playwright's Chromium headless shell
        run: pnpm exec playwright install --only-shell chromium
      - name: Run Playwright tests
        run: pnpm test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install
      - name: Build the site
        run: pnpm build
      - name: Run Lighthouse CI
        run: pnpm test:lighthouse
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [static-checks, e2e, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
